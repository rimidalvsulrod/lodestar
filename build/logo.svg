<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="0.6" stop-color="#0a121f"/>
      <stop offset="1" stop-color="#04070c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7fe9ff"/>
      <stop offset="0.55" stop-color="#2fa8ff"/>
      <stop offset="1" stop-color="#2450e8"/>
    </linearGradient>
    <linearGradient id="star" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffb347" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>

  <!-- globe grid -->
  <g clip-path="url(#globe)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="64" ry="150" stroke-width="7" stroke-opacity="0.55"/>
    <ellipse cx="256" cy="256" rx="122" ry="150" stroke-width="5" stroke-opacity="0.28"/>
    <line x1="96" y1="256" x2="416" y2="256" stroke-width="7" stroke-opacity="0.55"/>
    <path d="M110 186 Q256 214 402 186" stroke-width="5" stroke-opacity="0.3"/>
    <path d="M110 326 Q256 298 402 326" stroke-width="5" stroke-opacity="0.3"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="16"/>

  <!-- orbit -->
  <ellipse cx="256" cy="256" rx="206" ry="62" fill="none" stroke="#7fe9ff" stroke-opacity="0.35" stroke-width="5" transform="rotate(-24 256 256)"/>
  <circle cx="440" cy="174" r="11" fill="#7fe9ff"/>

  <!-- lodestar -->
  <circle cx="256" cy="256" r="130" fill="url(#halo)"/>
  <path d="M256 54 L274 238 L382 256 L274 274 L256 458 L238 274 L130 256 L238 238 Z" fill="url(#star)"/>
  <path d="M256 54 L274 238 L256 256 Z M382 256 L274 274 L256 256 Z M256 458 L238 274 L256 256 Z M130 256 L238 238 L256 256 Z" fill="#000" fill-opacity="0.16"/>
  <circle cx="256" cy="256" r="12" fill="#fffaf0"/>
</svg>
